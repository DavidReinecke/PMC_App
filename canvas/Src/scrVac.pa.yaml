Screens:
  scrVac:
    Properties:
      Fill: =RGBA(15, 18, 22, 1)
      OnVisible: |-
        =Set(varNotice, ""); Set(varPanel, ""); Set(varErr, "")
    Children:
      - rctHeaderVac:
          Control: Rectangle@2.3.0
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =64
            Fill: =RGBA(23, 28, 34, 1)
      - lblAppVac:
          Control: Label@2.5.1
          Properties:
            X: =16
            Y: =16
            Width: =240
            Height: =32
            Text: ="Workforce Planner"
            Color: =RGBA(230, 233, 238, 1)
            Size: =18
            FontWeight: =FontWeight.Bold
      - btnNavTOVac:
          Control: Classic/Button@2.2.0
          Properties:
            X: =270
            Y: =10
            Width: =190
            Height: =44
            Text: ="Tables of Organization"
            Visible: =true
            OnSelect: =Navigate(scrTO, ScreenTransition.None)
            Fill: =RGBA(29, 37, 46, 1)
            Color: =RGBA(230, 233, 238, 1)
            BorderColor: =RGBA(56, 66, 78, 1)
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
      - btnNavVacVac:
          Control: Classic/Button@2.2.0
          Properties:
            X: =468
            Y: =10
            Width: =170
            Height: =44
            Text: ="Vacancies & Hiring"
            Visible: =true
            OnSelect: =Navigate(scrVac, ScreenTransition.None)
            Fill: =RGBA(224, 164, 58, 1)
            Color: =RGBA(20, 17, 10, 1)
            BorderColor: =RGBA(56, 66, 78, 1)
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
      - btnNavApprVac:
          Control: Classic/Button@2.2.0
          Properties:
            X: =646
            Y: =10
            Width: =170
            Height: =44
            Text: ="Selection Approvals"
            Visible: =true
            OnSelect: =Navigate(scrAppr, ScreenTransition.None)
            Fill: =RGBA(29, 37, 46, 1)
            Color: =RGBA(230, 233, 238, 1)
            BorderColor: =RGBA(56, 66, 78, 1)
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
      - btnNavRolesVac:
          Control: Classic/Button@2.2.0
          Properties:
            X: =824
            Y: =10
            Width: =160
            Height: =44
            Text: ="Role Assignments"
            Visible: =varIsDA
            OnSelect: =Navigate(scrRoles, ScreenTransition.None)
            Fill: =RGBA(29, 37, 46, 1)
            Color: =RGBA(230, 233, 238, 1)
            BorderColor: =RGBA(56, 66, 78, 1)
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
      - ddAreaVac:
          Control: Classic/DropDown@2.3.1
          Properties:
            X: =1000
            Y: =10
            Width: =230
            Height: =44
            Items: ='Geographic Areas'
            Default: =varArea.Name
            Visible: =varCanSeeAll
            OnChange: |-
              =Set(varArea, Self.Selected); Set(varPanel, ""); ClearCollect(colUnitOpts, {Name: "All units"}, ForAll(Filter(FirstN(Units, 2000), 'Geographic area'.Name = varArea.Name), {Name: ThisRecord.Name}))
      - lblAreaFixedVac:
          Control: Label@2.5.1
          Properties:
            X: =1000
            Y: =10
            Width: =230
            Height: =44
            Text: =varArea.Name & " · your area"
            Visible: =!varCanSeeAll
            Color: =RGBA(154, 164, 178, 1)
            Size: =14
            VerticalAlign: =VerticalAlign.Middle
      - lblMeVac:
          Control: Label@2.5.1
          Properties:
            X: =1240
            Y: =10
            Width: =118
            Height: =44
            Text: =varMe
            Color: =RGBA(154, 164, 178, 1)
            Size: =12
            VerticalAlign: =VerticalAlign.Middle
      - lblVacTitle:
          Control: Label@2.5.1
          Properties:
            X: =16
            Y: =76
            Width: =600
            Height: =40
            Text: ="Vacancies & Hiring"
            Color: =RGBA(230, 233, 238, 1)
            Size: =24
            FontWeight: =FontWeight.Bold
      - lblVacNotice:
          Control: Label@2.5.1
          Properties:
            X: =640
            Y: =76
            Width: =712
            Height: =40
            Text: =varNotice
            Color: =RGBA(224, 164, 58, 1)
            Size: =13
            VerticalAlign: =VerticalAlign.Middle
      - galVac:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            X: =16
            Y: =124
            Width: =If(varPanel = "", Parent.Width - 32, 860)
            Height: =Parent.Height - 140
            TemplateSize: =128
            TemplatePadding: =6
            Items: =SortByColumns(Filter(FirstN('Hiring Actions', 2000), 'Geographic area'.Name = varArea.Name), "wfp_name", SortOrder.Ascending)
            Fill: =RGBA(15, 18, 22, 1)
          Children:
            - rctVacRow:
                Control: Rectangle@2.3.0
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth - 12
                  Height: =Parent.TemplateHeight - 8
                  Fill: =RGBA(23, 28, 34, 1)
                  BorderColor: =RGBA(56, 66, 78, 1)
                  BorderThickness: =1
            - lblVacId:
                Control: Label@2.5.1
                Properties:
                  X: =12
                  Y: =6
                  Width: =560
                  Height: =28
                  Color: =RGBA(230, 233, 238, 1)
                  Size: =15
                  FontWeight: =FontWeight.Semibold
                  Text: =ThisItem.'Action ID' & " · " & ThisItem.Position.'Position ID' & " · " & LookUp(Positions, 'Position ID' = ThisItem.Position.'Position ID').Title
            - lblVacMeta:
                Control: Label@2.5.1
                Properties:
                  X: =12
                  Y: =36
                  Width: =560
                  Height: =22
                  Color: =RGBA(154, 164, 178, 1)
                  Size: =12
                  Text: =Text(ThisItem.Position.'Pay plan') & " · " & ThisItem.Position.'Grade range' & " · " & Text(ThisItem.Position.'Employment type') & If(!IsBlank(ThisItem.Position.'Previous incumbent'), " · was " & ThisItem.Position.'Previous incumbent', "")
            - lblVacStage:
                Control: Label@2.5.1
                Properties:
                  X: =12
                  Y: =62
                  Width: =560
                  Height: =26
                  Color: =RGBA(224, 164, 58, 1)
                  Size: =13
                  FontWeight: =FontWeight.Semibold
                  Text: |-
                    ="Stage: " & Text(ThisItem.Stage) & If(!IsBlank(ThisItem.'Selected candidate'), " · Selected: " & ThisItem.'Selected candidate' & " (" & ThisItem.'Proposed grade and step' & ")", "") & If(!IsBlank(ThisItem.'Entry on duty'), " · Fills " & Text(ThisItem.'Entry on duty', "mmm d"), "")
            - ddVacStage:
                Control: Classic/DropDown@2.3.1
                Properties:
                  X: =12
                  Y: =88
                  Width: =240
                  Height: =34
                  Items: =["Cleared to advertise", "Announced", "Certificate issued", "Interviews"]
                  Default: =Text(ThisItem.Stage)
                  Visible: =varCanEditHiring && Text(ThisItem.Stage) in ["Cleared to advertise", "Announced", "Certificate issued", "Interviews"]
                  OnChange: |-
                    =Patch('Hiring Actions', ThisItem, {Stage: Switch(Self.Selected.Value, "Draft", 'Stage (Hiring Actions)'.Draft, "PMC review", 'Stage (Hiring Actions)'.'PMC review', "Cleared to advertise", 'Stage (Hiring Actions)'.'Cleared to advertise', "Announced", 'Stage (Hiring Actions)'.Announced, "Certificate issued", 'Stage (Hiring Actions)'.'Certificate issued', "Interviews", 'Stage (Hiring Actions)'.Interviews, "Selection approval", 'Stage (Hiring Actions)'.'Selection approval', "Selection approved", 'Stage (Hiring Actions)'.'Selection approved', "Offer", 'Stage (Hiring Actions)'.Offer)});
                    Patch('Hiring Events', Defaults('Hiring Events'), {Summary: ThisItem.'Action ID' & " moved to " & Self.Selected.Value, 'Event type': Switch("Stage change", "Stage change", 'Event type (Hiring Events)'.'Stage change', "Selection routed", 'Event type (Hiring Events)'.'Selection routed', "Approval", 'Event type (Hiring Events)'.Approval, "Detail", 'Event type (Hiring Events)'.Detail, "Incumbent change", 'Event type (Hiring Events)'.'Incumbent change', "Role assigned", 'Event type (Hiring Events)'.'Role assigned'), 'Geographic area': varArea, By: varMe, Note: ""});
                    Set(varNotice, ThisItem.'Action ID' & " moved to " & Self.Selected.Value & ".")
            - btnVacSubmit:
                Control: Classic/Button@2.2.0
                Properties:
                  X: =264
                  Y: =88
                  Width: =190
                  Height: =34
                  Text: ="Submit selection"
                  Visible: =varCanEditHiring && Text(ThisItem.Stage) = "Interviews"
                  Fill: =RGBA(224, 164, 58, 1)
                  Color: =RGBA(20, 17, 10, 1)
                  BorderColor: =RGBA(224, 164, 58, 1)
                  OnSelect: =Set(varSelAct, ThisItem); Set(varPanel, "sel"); Set(varErr, ""); Reset(txtSelCand); Reset(txtSelGrade)
            - ddVacFund:
                Control: Classic/DropDown@2.3.1
                Properties:
                  X: =Parent.TemplateWidth - 280
                  Y: =8
                  Width: =190
                  Height: =34
                  Items: =["Approved", "Pending", "Not approved"]
                  Default: =Text(ThisItem.Position.'Funding status')
                  Visible: =varCanFund && Text(ThisItem.Position.'Position status') = "Vacant"
                  OnChange: |-
                    =Patch(Positions, ThisItem.Position, {'Funding status': Switch(Self.Selected.Value, "Approved", 'Funding status (Positions)'.Approved, "Pending", 'Funding status (Positions)'.Pending, "Not approved", 'Funding status (Positions)'.'Not approved')});
                    Set(varNotice, "Funding for " & ThisItem.Position.'Position ID' & " set to " & Self.Selected.Value & ".")
            - dpVacEod:
                Control: Classic/DatePicker@2.6.0
                Properties:
                  X: =Parent.TemplateWidth - 280
                  Y: =50
                  Width: =170
                  Height: =34
                  Visible: =varCanEditHiring && Text(ThisItem.Stage) = "Offer"
                  DefaultDate: =ThisItem.'Entry on duty'
            - btnVacEod:
                Control: Classic/Button@2.2.0
                Properties:
                  X: =Parent.TemplateWidth - 280
                  Y: =88
                  Width: =190
                  Height: =34
                  Text: ="Set entry on duty"
                  Visible: =varCanEditHiring && Text(ThisItem.Stage) = "Offer"
                  Fill: =RGBA(29, 37, 46, 1)
                  Color: =RGBA(230, 233, 238, 1)
                  BorderColor: =RGBA(56, 66, 78, 1)
                  OnSelect: |-
                    =If(IsBlank(dpVacEod.SelectedDate),
                        Set(varNotice, "Choose an entry on duty date."),
                        Patch('Hiring Actions', ThisItem, {'Entry on duty': dpVacEod.SelectedDate});
                        If(dpVacEod.SelectedDate <= Today(),
                            Patch(Positions, ThisItem.Position, {Incumbent: ThisItem.'Selected candidate', 'Position status': Switch("Filled", "Filled", 'Position status (Positions)'.Filled, "Vacant", 'Position status (Positions)'.Vacant), 'Previous incumbent': ""});
                            Set(varNotice, ThisItem.Position.'Position ID' & " is filled by " & ThisItem.'Selected candidate' & "."),
                            Set(varNotice, "Entry on duty set. The daily fill flow puts " & ThisItem.'Selected candidate' & " into the position on that date.")))
      - rctSelPanel:
          Control: Rectangle@2.3.0
          Properties:
            X: =892
            Y: =124
            Width: =458
            Height: =330
            Fill: =RGBA(23, 28, 34, 1)
            BorderColor: =RGBA(224, 164, 58, 1)
            BorderThickness: =1
            Visible: =varPanel = "sel"
      - lblSelTitle:
          Control: Label@2.5.1
          Properties:
            X: =908
            Y: =136
            Width: =426
            Height: =52
            Visible: =varPanel = "sel"
            Color: =RGBA(230, 233, 238, 1)
            Size: =16
            FontWeight: =FontWeight.Bold
            Text: ="Submit selection · " & varSelAct.'Action ID' & " · " & LookUp(Positions, 'Position ID' = varSelAct.Position.'Position ID').Title
      - txtSelCand:
          Control: Classic/TextInput@2.3.2
          Properties:
            X: =908
            Y: =196
            Width: =426
            Height: =44
            Visible: =varPanel = "sel"
            HintText: ="Selected candidate"
            Color: =RGBA(230, 233, 238, 1)
            Fill: =RGBA(29, 37, 46, 1)
            BorderColor: =RGBA(56, 66, 78, 1)
      - txtSelGrade:
          Control: Classic/TextInput@2.3.2
          Properties:
            X: =908
            Y: =248
            Width: =426
            Height: =44
            Visible: =varPanel = "sel"
            HintText: ="Proposed grade and step, for example GS-12 Step 3"
            Color: =RGBA(230, 233, 238, 1)
            Fill: =RGBA(29, 37, 46, 1)
            BorderColor: =RGBA(56, 66, 78, 1)
      - lblSelRoute:
          Control: Label@2.5.1
          Properties:
            X: =908
            Y: =298
            Width: =426
            Height: =44
            Visible: =varPanel = "sel"
            Color: =RGBA(154, 164, 178, 1)
            Size: =12
            Text: |-
              =With({m: Match(Upper(txtSelGrade.Text), "(?<plan>GS|GW|WG)\s*-?\s*(?<g>\d{1,2})")},
                  "Final approval routes to: " & If(
                      Coalesce(Value(m.g), varSelAct.Position.'Full performance grade') >= 10, "Area fire chief or deputy chief",
                      Coalesce(m.plan, Text(varSelAct.Position.'Pay plan')) = "GW", "Assistant Chief, Operations",
                      "Assistant Chief, Support Services"))
      - btnSelSubmit:
          Control: Classic/Button@2.2.0
          Properties:
            X: =908
            Y: =350
            Width: =206
            Height: =44
            Text: ="Submit for approval"
            Visible: =varPanel = "sel"
            Fill: =RGBA(224, 164, 58, 1)
            Color: =RGBA(20, 17, 10, 1)
            BorderColor: =RGBA(224, 164, 58, 1)
            OnSelect: |-
              =If(IsBlank(txtSelCand.Text) || IsBlank(txtSelGrade.Text),
                  Set(varErr, "Add the selected candidate and the proposed grade and step."),
                  With({m: Match(Upper(txtSelGrade.Text), "(?<plan>GS|GW|WG)\s*-?\s*(?<g>\d{1,2})")},
                      With({vG: Coalesce(Value(m.g), varSelAct.Position.'Full performance grade'), vPlan: Coalesce(m.plan, Text(varSelAct.Position.'Pay plan')),
                            vRound: CountRows(Filter(FirstN('Selection Approval Steps', 2000), 'Hiring action'.'Action ID' = varSelAct.'Action ID', Sequence = 1)) + 1,
                            vSupEmail: LookUp(Positions, 'Position ID' = varSelAct.Position.'Position ID').'Supervisor position'.'Incumbent email'},
                          With({vGroup: If(vG >= 10, "Area chief or deputy", If(vPlan = "GW", "Assistant Chief Operations", "Assistant Chief Support Services"))},
                              Patch('Hiring Actions', varSelAct, {Stage: Switch("Selection approval", "Draft", 'Stage (Hiring Actions)'.Draft, "PMC review", 'Stage (Hiring Actions)'.'PMC review', "Cleared to advertise", 'Stage (Hiring Actions)'.'Cleared to advertise', "Announced", 'Stage (Hiring Actions)'.Announced, "Certificate issued", 'Stage (Hiring Actions)'.'Certificate issued', "Interviews", 'Stage (Hiring Actions)'.Interviews, "Selection approval", 'Stage (Hiring Actions)'.'Selection approval', "Selection approved", 'Stage (Hiring Actions)'.'Selection approved', "Offer", 'Stage (Hiring Actions)'.Offer), 'Selected candidate': txtSelCand.Text, 'Proposed grade and step': Upper(txtSelGrade.Text)});
                              Collect('Selection Approval Steps',
                                  {Step: varSelAct.'Action ID' & " r" & vRound & " step 1", 'Hiring action': varSelAct, 'Geographic area': varArea, Sequence: 1, 'Approval round': vRound, 'Approver group': Switch("Supervisor", "Supervisor", 'Approver group (Selection Approval Steps)'.Supervisor, "Budget", 'Approver group (Selection Approval Steps)'.Budget, "Assistant Chief Operations", 'Approver group (Selection Approval Steps)'.'Assistant Chief Operations', "Assistant Chief Support Services", 'Approver group (Selection Approval Steps)'.'Assistant Chief Support Services', "Area chief or deputy", 'Approver group (Selection Approval Steps)'.'Area chief or deputy'), Decision: Switch("Pending", "Waiting", 'Decision (Selection Approval Steps)'.Waiting, "Pending", 'Decision (Selection Approval Steps)'.Pending, "Approved", 'Decision (Selection Approval Steps)'.Approved, "Returned", 'Decision (Selection Approval Steps)'.Returned), 'Supervisor email': vSupEmail, Position: varSelAct.Position.'Position ID' & " " & LookUp(Positions, 'Position ID' = varSelAct.Position.'Position ID').Title},
                                  {Step: varSelAct.'Action ID' & " r" & vRound & " step 2", 'Hiring action': varSelAct, 'Geographic area': varArea, Sequence: 2, 'Approval round': vRound, 'Approver group': Switch("Budget", "Supervisor", 'Approver group (Selection Approval Steps)'.Supervisor, "Budget", 'Approver group (Selection Approval Steps)'.Budget, "Assistant Chief Operations", 'Approver group (Selection Approval Steps)'.'Assistant Chief Operations', "Assistant Chief Support Services", 'Approver group (Selection Approval Steps)'.'Assistant Chief Support Services', "Area chief or deputy", 'Approver group (Selection Approval Steps)'.'Area chief or deputy'), Decision: Switch("Waiting", "Waiting", 'Decision (Selection Approval Steps)'.Waiting, "Pending", 'Decision (Selection Approval Steps)'.Pending, "Approved", 'Decision (Selection Approval Steps)'.Approved, "Returned", 'Decision (Selection Approval Steps)'.Returned), Position: varSelAct.Position.'Position ID' & " " & LookUp(Positions, 'Position ID' = varSelAct.Position.'Position ID').Title},
                                  {Step: varSelAct.'Action ID' & " r" & vRound & " step 3", 'Hiring action': varSelAct, 'Geographic area': varArea, Sequence: 3, 'Approval round': vRound, 'Approver group': Switch(vGroup, "Supervisor", 'Approver group (Selection Approval Steps)'.Supervisor, "Budget", 'Approver group (Selection Approval Steps)'.Budget, "Assistant Chief Operations", 'Approver group (Selection Approval Steps)'.'Assistant Chief Operations', "Assistant Chief Support Services", 'Approver group (Selection Approval Steps)'.'Assistant Chief Support Services', "Area chief or deputy", 'Approver group (Selection Approval Steps)'.'Area chief or deputy'), Decision: Switch("Waiting", "Waiting", 'Decision (Selection Approval Steps)'.Waiting, "Pending", 'Decision (Selection Approval Steps)'.Pending, "Approved", 'Decision (Selection Approval Steps)'.Approved, "Returned", 'Decision (Selection Approval Steps)'.Returned), Position: varSelAct.Position.'Position ID' & " " & LookUp(Positions, 'Position ID' = varSelAct.Position.'Position ID').Title});
                              Patch('Hiring Events', Defaults('Hiring Events'), {Summary: "Submitted selection for " & varSelAct.'Action ID' & " (" & txtSelCand.Text & ", " & Upper(txtSelGrade.Text) & "), final approver " & vGroup, 'Event type': Switch("Selection routed", "Stage change", 'Event type (Hiring Events)'.'Stage change', "Selection routed", 'Event type (Hiring Events)'.'Selection routed', "Approval", 'Event type (Hiring Events)'.Approval, "Detail", 'Event type (Hiring Events)'.Detail, "Incumbent change", 'Event type (Hiring Events)'.'Incumbent change', "Role assigned", 'Event type (Hiring Events)'.'Role assigned'), 'Geographic area': varArea, By: varMe, Note: ""});
                              Set(varNotice, "Submitted. Final approval routes to " & vGroup & ".");
                              Set(varPanel, "")))))
      - lblSelErr:
          Control: Label@2.5.1
          Properties:
            X: =908
            Y: =398
            Width: =426
            Height: =24
            Visible: =varPanel = "sel"
            Color: =RGBA(244, 165, 138, 1)
            Size: =13
            Text: =varErr
      - btnSelClose:
          Control: Classic/Button@2.2.0
          Properties:
            X: =1126
            Y: =350
            Width: =208
            Height: =44
            Text: ="Cancel"
            Visible: =varPanel = "sel"
            Fill: =RGBA(29, 37, 46, 1)
            Color: =RGBA(230, 233, 238, 1)
            BorderColor: =RGBA(56, 66, 78, 1)
            OnSelect: =Set(varPanel, ""); Set(varErr, "")
