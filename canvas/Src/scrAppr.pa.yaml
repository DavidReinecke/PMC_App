Screens:
  scrAppr:
    Properties:
      Fill: =RGBA(15, 18, 22, 1)
      OnVisible: |-
        =Set(varNotice, "")
    Children:
      - rctHeaderAppr:
          Control: Rectangle@2.3.0
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =If(Parent.Width < 1000, 112, 64)
            Fill: =RGBA(23, 28, 34, 1)
      - lblAppAppr:
          Control: Label@2.5.1
          Properties:
            Visible: =Parent.Width >= 1200 || Parent.Width < 1000
            X: =16
            Y: =16
            Width: =240
            Height: =32
            Text: ="Workforce Planner"
            Color: =RGBA(230, 233, 238, 1)
            Size: =18
            FontWeight: =FontWeight.Bold
      - btnNavTOAppr:
          Control: Classic/Button@2.2.0
          Properties:
            Size: =12
            X: =If(Parent.Width >= 1200, 270, 16)
            Y: =If(Parent.Width < 1000, 58, 10)
            Width: =If(Parent.Width >= 1200, 190, 170)
            Height: =44
            Text: ="Tables of Organization"
            Visible: =true
            OnSelect: =Navigate(scrTO, ScreenTransition.None)
            Fill: =RGBA(29, 37, 46, 1)
            Color: =RGBA(230, 233, 238, 1)
            BorderColor: =RGBA(56, 66, 78, 1)
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
      - btnNavVacAppr:
          Control: Classic/Button@2.2.0
          Properties:
            Size: =12
            X: =If(Parent.Width >= 1200, 468, 194)
            Y: =If(Parent.Width < 1000, 58, 10)
            Width: =If(Parent.Width >= 1200, 170, 150)
            Height: =44
            Text: ="Vacancies & Hiring"
            Visible: =true
            OnSelect: =Navigate(scrVac, ScreenTransition.None)
            Fill: =RGBA(29, 37, 46, 1)
            Color: =RGBA(230, 233, 238, 1)
            BorderColor: =RGBA(56, 66, 78, 1)
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
      - btnNavApprAppr:
          Control: Classic/Button@2.2.0
          Properties:
            Size: =12
            X: =If(Parent.Width >= 1200, 646, 352)
            Y: =If(Parent.Width < 1000, 58, 10)
            Width: =If(Parent.Width >= 1200, 170, 150)
            Height: =44
            Text: ="Selection Approvals"
            Visible: =true
            OnSelect: =Navigate(scrAppr, ScreenTransition.None)
            Fill: =RGBA(224, 164, 58, 1)
            Color: =RGBA(20, 17, 10, 1)
            BorderColor: =RGBA(56, 66, 78, 1)
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
      - btnNavRolesAppr:
          Control: Classic/Button@2.2.0
          Properties:
            Size: =12
            X: =If(Parent.Width >= 1200, 824, 510)
            Y: =If(Parent.Width < 1000, 58, 10)
            Width: =If(Parent.Width >= 1200, 160, 140)
            Height: =44
            Text: ="Role Assignments"
            Visible: =varIsDA
            OnSelect: =Navigate(scrRoles, ScreenTransition.None)
            Fill: =RGBA(29, 37, 46, 1)
            Color: =RGBA(230, 233, 238, 1)
            BorderColor: =RGBA(56, 66, 78, 1)
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
      - ddAreaAppr:
          Control: Classic/DropDown@2.3.1
          Properties:
            X: =If(Parent.Width >= 1200, Parent.Width - 366, If(Parent.Width >= 1000, Parent.Width - 336, 270))
            Y: =10
            Width: =If(Parent.Width >= 1200, 230, If(Parent.Width >= 1000, 200, Parent.Width - 404))
            Height: =44
            Items: ='Geographic Areas'
            Default: =varArea.Name
            Visible: =varCanSeeAll
            OnChange: |-
              =Set(varArea, Self.Selected); Set(varPanel, ""); ClearCollect(colUnitOpts, {Name: "All units"}, ForAll(Filter(FirstN(Units, 2000), 'Geographic area'.Name = varArea.Name), {Name: ThisRecord.Name}))
      - lblAreaFixedAppr:
          Control: Label@2.5.1
          Properties:
            X: =If(Parent.Width >= 1200, Parent.Width - 366, If(Parent.Width >= 1000, Parent.Width - 336, 270))
            Y: =10
            Width: =If(Parent.Width >= 1200, 230, If(Parent.Width >= 1000, 200, Parent.Width - 404))
            Height: =44
            Text: =varArea.Name & " · your area"
            Visible: =!varCanSeeAll
            Color: =RGBA(154, 164, 178, 1)
            Size: =14
            VerticalAlign: =VerticalAlign.Middle
      - lblMeAppr:
          Control: Label@2.5.1
          Properties:
            X: =Parent.Width - 126
            Y: =10
            Width: =118
            Height: =44
            Text: =varMe
            Color: =RGBA(154, 164, 178, 1)
            Size: =12
            VerticalAlign: =VerticalAlign.Middle
      - lblApprTitle:
          Control: Label@2.5.1
          Properties:
            X: =16
            Y: =76 + If(Parent.Width < 1000, 48, 0)
            Width: =Parent.Width * 0.5 - 24
            Height: =40
            Text: ="Selection Approvals"
            Color: =RGBA(230, 233, 238, 1)
            Size: =24
            FontWeight: =FontWeight.Bold
      - lblApprHelp:
          Control: Label@2.5.1
          Properties:
            X: =16
            Y: =116 + If(Parent.Width < 1000, 48, 0)
            Width: =Parent.Width - 32
            Height: =30
            Color: =RGBA(154, 164, 178, 1)
            Size: =12
            Text: |-
              ="Steps: Supervisor, Budget, then the final approver. GW below 10: Assistant Chief, Operations. GS or WG below 10: Assistant Chief, Support Services. Grade 10 and above: area fire chief or deputy chief."
      - lblApprNotice:
          Control: Label@2.5.1
          Properties:
            X: =Parent.Width * 0.5
            Y: =76 + If(Parent.Width < 1000, 48, 0)
            Width: =Parent.Width * 0.5 - 16
            Height: =40
            Text: =varNotice
            Color: =RGBA(224, 164, 58, 1)
            Size: =13
            VerticalAlign: =VerticalAlign.Middle
      - txtApprComment:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =""
            X: =16
            Y: =150 + If(Parent.Width < 1000, 48, 0)
            Width: =Parent.Width - 32
            Height: =44
            HintText: ="Comment (required when returning a selection)"
            Color: =RGBA(230, 233, 238, 1)
            Fill: =RGBA(29, 37, 46, 1)
            BorderColor: =RGBA(56, 66, 78, 1)
      - galAppr:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            X: =16
            Y: =204 + If(Parent.Width < 1000, 48, 0)
            Width: =Parent.Width - 32
            Height: =Parent.Height - 220 - If(Parent.Width < 1000, 48, 0)
            TemplateSize: =250
            TemplatePadding: =8
            Items: =Filter(FirstN('Hiring Actions', 2000), 'Geographic area'.Name = varArea.Name, Text(Stage) = "Selection approval")
            Fill: =RGBA(15, 18, 22, 1)
          Children:
            - rctApprRow:
                Control: Rectangle@2.3.0
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth - 12
                  Height: =Parent.TemplateHeight - 8
                  Fill: =RGBA(23, 28, 34, 1)
                  BorderColor: =RGBA(56, 66, 78, 1)
                  BorderThickness: =1
            - lblApprId:
                Control: Label@2.5.1
                Properties:
                  X: =12
                  Y: =6
                  Width: =900
                  Height: =28
                  Color: =RGBA(230, 233, 238, 1)
                  Size: =15
                  FontWeight: =FontWeight.Semibold
                  Text: =ThisItem.'Action ID' & " · " & ThisItem.Position.'Position ID' & " · " & LookUp(Positions, 'Position ID' = ThisItem.Position.'Position ID').Title
            - lblApprSel:
                Control: Label@2.5.1
                Properties:
                  X: =12
                  Y: =36
                  Width: =900
                  Height: =24
                  Color: =RGBA(154, 164, 178, 1)
                  Size: =13
                  Text: |-
                    ="Selected: " & ThisItem.'Selected candidate' & " · Proposed " & ThisItem.'Proposed grade and step'
            - galSteps:
                Control: Gallery@2.15.0
                Variant: Horizontal
                Properties:
                  X: =12
                  Y: =66
                  Width: =Parent.TemplateWidth - 36
                  Height: =168
                  TemplateSize: =420
                  TemplatePadding: =6
                  Items: =Sort(Filter(FirstN('Selection Approval Steps', 2000), 'Hiring action'.'Action ID' = ThisItem.'Action ID', 'Approval round' = Max(Filter(FirstN('Selection Approval Steps', 2000), 'Hiring action'.'Action ID' = ThisItem.'Action ID'), 'Approval round')), Sequence, SortOrder.Ascending)
                  Fill: =RGBA(23, 28, 34, 1)
