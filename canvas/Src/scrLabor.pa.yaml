Screens:
  scrLabor:
    Properties:
      Fill: =RGBA(15, 18, 22, 1)
      OnVisible: |-
        =Set(varNotice, ""); Set(varPanel, ""); Set(varErr, ""); Set(varShowPay, false);
        ClearCollect(colUnitOpts, {Name: "All units"}, ForAll(Filter(FirstN(Units, 2000), 'Geographic area'.Name = varArea.Name), {Name: ThisRecord.Name}));
        // Pay rates come from the Pay Rates table. Step 5, latest effective year that has started.
        ClearCollect(colPayRaw, ForAll(Filter(FirstN('Pay Rates', 5000), Step = 5), {plan: Text('Pay plan'), g: Grade, rate: 'Annual rate', yr: 'Effective year', wa: Coalesce('Wage area', "")}));
        Set(varPayYear, Coalesce(Max(Filter(colPayRaw, yr <= Year(Today())), yr), Max(colPayRaw, yr), 0));
        Set(varWgPlaceholder, CountRows(Filter(colPayRaw, plan = "WG" && yr = varPayYear && Lower(wa) = "placeholder")) > 0);
        ClearCollect(colPay, ForAll(Sequence(15), With({n: Value}, {g: n, gs: Coalesce(LookUp(colPayRaw, plan = "GS" && g = n && yr = varPayYear).rate, 0), gw: Coalesce(LookUp(colPayRaw, plan = "GW" && g = n && yr = varPayYear).rate, 0), wg: Coalesce(LookUp(colPayRaw, plan = "WG" && g = n && yr = varPayYear).rate, 0)})));
        // Premium percent is saved per geographic area
        Set(varPrem, Coalesce(LookUp(FirstN('Labor Settings', 2000), 'Geographic area'.Name = varArea.Name).'Premium percent', 32))
    Children:
      - rctHeaderLabor:
          Control: Rectangle@2.3.0
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =If(Parent.Width < 1000, 112, 64)
            Fill: =RGBA(23, 28, 34, 1)
      - lblAppLabor:
