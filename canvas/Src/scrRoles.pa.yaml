Screens:
  scrRoles:
    Properties:
      Fill: =RGBA(15, 18, 22, 1)
      OnVisible: |-
        =Set(varNotice, ""); Set(varPanel, ""); Set(varErr, "")
    Children:
      - rctHeaderRoles:
          Control: Rectangle@2.3.0
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =If(Parent.Width < 1000, 112, 64)
            Fill: =RGBA(23, 28, 34, 1)
      - lblAppRoles:
          Control: Label@2.5.1
          Properties:
            Visible: =Parent.Width >= 1340 || Parent.Width < 1000
            X: =16
            Y: =16
            Width: =240
            Height: =32
            Text: ="Workforce Planner"
            Color: =RGBA(230, 233, 238, 1)
            Size: =18
            FontWeight: =FontWeight.Bold
      - btnNavTORoles:
          Control: Classic/Button@2.2.0
          Properties:
            Size: =12
            X: =If(Parent.Width >= 1340, 270, 16)
            Y: =If(Parent.Width < 1000, 58, 10)
            Width: =160
            Height: =44
            Text: ="Tables of Organization"
            Visible: =true
            OnSelect: =Navigate(scrTO, ScreenTransition.None)
            Fill: =RGBA(29, 37, 46, 1)
            Color: =RGBA(230, 233, 238, 1)
            BorderColor: =RGBA(56, 66, 78, 1)
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
      - btnNavVacRoles:
          Control: Classic/Button@2.2.0
          Properties:
            Size: =12
            X: =If(Parent.Width >= 1340, 438, 184)
            Y: =If(Parent.Width < 1000, 58, 10)
            Width: =140
            Height: =44
            Text: ="Vacancies & Hiring"
            Visible: =true
            OnSelect: =Navigate(scrVac, ScreenTransition.None)
            Fill: =RGBA(29, 37, 46, 1)
            Color: =RGBA(230, 233, 238, 1)
            BorderColor: =RGBA(56, 66, 78, 1)
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
      - btnNavApprRoles:
          Control: Classic/Button@2.2.0
          Properties:
            Size: =12
            X: =If(Parent.Width >= 1340, 586, 332)
            Y: =If(Parent.Width < 1000, 58, 10)
            Width: =140
            Height: =44
            Text: ="Selection Approvals"
            Visible: =true
            OnSelect: =Navigate(scrAppr, ScreenTransition.None)
            Fill: =RGBA(29, 37, 46, 1)
            Color: =RGBA(230, 233, 238, 1)
            BorderColor: =RGBA(56, 66, 78, 1)
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
      - btnNavLaborRoles:
          Control: Classic/Button@2.2.0
          Properties:
            Size: =12
            X: =If(Parent.Width >= 1340, 734, 480)
            Y: =If(Parent.Width < 1000, 58, 10)
            Width: =120
            Height: =44
            Text: ="Labor Estimate"
            Visible: =true
            OnSelect: =Navigate(scrLabor, ScreenTransition.None)
            Fill: =RGBA(29, 37, 46, 1)
            Color: =RGBA(230, 233, 238, 1)
            BorderColor: =RGBA(56, 66, 78, 1)
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
      - btnNavRolesRoles:
          Control: Classic/Button@2.2.0
          Properties:
            Size: =12
            X: =If(Parent.Width >= 1340, 862, 608)
            Y: =If(Parent.Width < 1000, 58, 10)
            Width: =120
            Height: =44
            Text: ="Role Assignments"
            Visible: =varIsDA
            OnSelect: =Navigate(scrRoles, ScreenTransition.None)
            Fill: =RGBA(224, 164, 58, 1)
            Color: =RGBA(20, 17, 10, 1)
            BorderColor: =RGBA(56, 66, 78, 1)
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
      - ddAreaRoles:
          Control: Classic/DropDown@2.3.1
          Properties:
            X: =If(Parent.Width >= 1340, Parent.Width - 336, If(Parent.Width >= 1000, 736, 270))
            Y: =10
            Width: =If(Parent.Width >= 1340, 200, If(Parent.Width >= 1000, Max(140, Parent.Width - 870), Parent.Width - 404))
            Height: =44
            Items: ='Geographic Areas'
            Default: =varArea.Name
            Visible: =varCanSeeAll
            OnChange: |-
              =Set(varArea, Self.Selected); Set(varPanel, ""); ClearCollect(colUnitOpts, {Name: "All units"}, ForAll(Filter(FirstN(Units, 2000), 'Geographic area'.Name = varArea.Name), {Name: ThisRecord.Name}))
      - lblAreaFixedRoles:
          Control: Label@2.5.1
          Properties:
            X: =If(Parent.Width >= 1340, Parent.Width - 336, If(Parent.Width >= 1000, 736, 270))
            Y: =10
            Width: =If(Parent.Width >= 1340, 200, If(Parent.Width >= 1000, Max(140, Parent.Width - 870), Parent.Width - 404))
            Height: =44
            Text: =varArea.Name & " · your area"
            Visible: =!varCanSeeAll
            Color: =RGBA(154, 164, 178, 1)
            Size: =14
            VerticalAlign: =VerticalAlign.Middle
      - lblMeRoles:
          Control: Label@2.5.1
          Properties:
            X: =Parent.Width - 126
            Y: =10
            Width: =118
            Height: =44
            Text: =varMe
            Color: =RGBA(154, 164, 178, 1)
            Size: =12
            VerticalAlign: =VerticalAlign.Middle
      - lblRoleTitle:
          Control: Label@2.5.1
          Properties:
            X: =16
            Y: =76 + If(Parent.Width < 1000, 48, 0)
            Width: =Parent.Width * 0.5 - 24
            Height: =40
            Text: ="Role Assignments"
            Color: =RGBA(230, 233, 238, 1)
            Size: =24
            FontWeight: =FontWeight.Bold
      - lblRoleHelp:
          Control: Label@2.5.1
          Properties:
            X: =16
            Y: =114 + If(Parent.Width < 1000, 48, 0)
            Width: =Min(900, Parent.Width - 32)
            Height: =40
            Color: =RGBA(154, 164, 178, 1)
            Size: =12
            Text: =If(varIsDAAll, "You assign roles in any area and can appoint data administrators for one area or all areas.", "You assign roles for " & varArea.Name & " only.") & " Supervisors come from the position hierarchy and are not assigned here."
      - lblRoleNotice:
          Control: Label@2.5.1
          Properties:
            X: =Parent.Width * 0.5
            Y: =76 + If(Parent.Width < 1000, 48, 0)
            Width: =Parent.Width * 0.5 - 16
            Height: =40
            Text: =varNotice
            Color: =RGBA(224, 164, 58, 1)
            Size: =13
            VerticalAlign: =VerticalAlign.Middle
      - txtRoleSearch:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =""
            X: =16
            Y: =160 + If(Parent.Width < 1000, 48, 0)
            Width: =420
            Height: =44
            HintText: ="Search by name or role"
            Color: =RGBA(230, 233, 238, 1)
            Fill: =RGBA(29, 37, 46, 1)
            BorderColor: =RGBA(56, 66, 78, 1)
      - tglEnded:
          Control: Classic/Toggle@2.1.0
          Properties:
            X: =450
            Y: =160 + If(Parent.Width < 1000, 48, 0)
            Width: =190
            Height: =44
            Default: =false
            TrueText: ="Show ended"
            FalseText: ="Active only"
            Color: =RGBA(230, 233, 238, 1)
      - btnRoleAdd:
          Control: Classic/Button@2.2.0
          Properties:
            X: =Parent.Width - 216
            Y: =160 + If(Parent.Width < 1000, 48, 0)
            Width: =200
            Height: =44
            Text: ="Assign a role"
            Fill: =RGBA(224, 164, 58, 1)
            Color: =RGBA(20, 17, 10, 1)
            BorderColor: =RGBA(224, 164, 58, 1)
            OnSelect: =Set(varPanel, "role"); Set(varErr, ""); Reset(txtRName); Reset(txtREmail); Reset(ddRRole)
      - galRoles:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            X: =16
            Y: =214 + If(Parent.Width < 1000, 48, 0)
            Width: =If(varPanel = "", Parent.Width - 32, If(Parent.Width < 1000, Parent.Width - 32, Parent.Width - 506))
            Height: =Parent.Height - 230 - If(Parent.Width < 1000, 48, 0)
            TemplateSize: =72
            TemplatePadding: =6
            Items: |-
              =Sort(Filter(FirstN('Role Assignments', 2000),
                  'Geographic area'.Name = varArea.Name || (varIsDAAll && 'All areas'),
                  tglEnded.Value || Text('Assignment status') = "Active",
                  IsBlank(txtRoleSearch.Text) || txtRoleSearch.Text in 'Person' || txtRoleSearch.Text in Text(Role)), Person, SortOrder.Ascending)
            Fill: =RGBA(15, 18, 22, 1)
          Children:
            - rctRoleRow:
                Control: Rectangle@2.3.0
                Properties:
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth - 12
                  Height: =Parent.TemplateHeight - 8
                  Fill: =RGBA(23, 28, 34, 1)
                  BorderColor: =RGBA(56, 66, 78, 1)
                  BorderThickness: =1
            - lblRoleName:
                Control: Label@2.5.1
                Properties:
                  X: =12
                  Y: =6
                  Width: =420
                  Height: =26
                  Color: =RGBA(230, 233, 238, 1)
                  Size: =15
                  FontWeight: =FontWeight.Semibold
                  Text: =ThisItem.Person & " · " & Text(ThisItem.Role)
            - lblRoleMeta:
                Control: Label@2.5.1
                Properties:
                  X: =12
                  Y: =34
                  Width: =520
                  Height: =22
                  Color: =RGBA(154, 164, 178, 1)
                  Size: =12
                  Text: =If(ThisItem.'All areas', "All areas", ThisItem.'Geographic area'.Name) & " · " & ThisItem.'User email' & " · " & Text(ThisItem.'Assignment status') & " · since " & Text(ThisItem.'Start date', "mmm d, yyyy")
            - lblRoleSees:
                Control: Label@2.5.1
                Properties:
                  X: =540
                  Y: =34
                  Width: =200
                  Height: =22
                  Color: =RGBA(224, 164, 58, 1)
                  Size: =12
                  Text: =If(Text(ThisItem.Role) in ["Area fire chief", "Deputy chief", "Assistant Chief Operations", "Assistant Chief Support Services"], "All areas, view", If(ThisItem.'All areas', "All areas, administer", "Own area only"))
            - btnRoleEnd:
                Control: Classic/Button@2.2.0
                Properties:
                  X: =Parent.TemplateWidth - 140
                  Y: =14
                  Width: =110
                  Height: =40
                  Text: ="End"
                  Visible: =Text(ThisItem.'Assignment status') = "Active"
                  Fill: =RGBA(29, 37, 46, 1)
                  Color: =RGBA(230, 233, 238, 1)
                  BorderColor: =RGBA(56, 66, 78, 1)
                  OnSelect: |-
                    =Patch('Role Assignments', ThisItem, {'Assignment status': Switch("Ended", "Active", 'Assignment status (Role Assignments)'.Active, "Ended", 'Assignment status (Role Assignments)'.Ended)});
                    Patch('Hiring Events', Defaults('Hiring Events'), {Summary: "Ended " & Text(ThisItem.Role) & " for " & ThisItem.Person, 'Event type': Switch("Role assigned", "Stage change", 'Event type (Hiring Events)'.'Stage change', "Selection routed", 'Event type (Hiring Events)'.'Selection routed', "Approval", 'Event type (Hiring Events)'.Approval, "Detail", 'Event type (Hiring Events)'.Detail, "Incumbent change", 'Event type (Hiring Events)'.'Incumbent change', "Role assigned", 'Event type (Hiring Events)'.'Role assigned'), 'Geographic area': varArea, By: varMe, Note: ""});
                    Set(varNotice, "Ended " & ThisItem.Person & "'s " & Text(ThisItem.Role) & " assignment.")
      - rctRolePanel:
          Control: Rectangle@2.3.0
          Properties:
            X: =If(Parent.Width < 1000, 16, Parent.Width - 474)
            Y: =214 + If(Parent.Width < 1000, 48, 0)
            Width: =If(Parent.Width < 1000, Parent.Width - 32, 458)
            Height: =470
            Fill: =RGBA(23, 28, 34, 1)
            BorderColor: =RGBA(224, 164, 58, 1)
            BorderThickness: =1
            Visible: =varPanel = "role"
      - lblRolePanelTitle:
          Control: Label@2.5.1
          Properties:
            X: =If(Parent.Width < 1000, 16, Parent.Width - 474) + 16
            Y: =226 + If(Parent.Width < 1000, 48, 0)
            Width: =If(Parent.Width < 1000, Parent.Width - 32, 458) - 32
            Height: =32
            Visible: =varPanel = "role"
            Color: =RGBA(230, 233, 238, 1)
            Size: =16
            FontWeight: =FontWeight.Bold
            Text: ="Assign a role"
      - lblRHelp:
          Control: Label@2.5.1
          Properties:
            X: =If(Parent.Width < 1000, 16, Parent.Width - 474) + 16
            Y: =258 + If(Parent.Width < 1000, 48, 0)
            Width: =If(Parent.Width < 1000, Parent.Width - 32, 458) - 32
            Height: =40
            Visible: =varPanel = "role"
            Color: =RGBA(154, 164, 178, 1)
            Size: =12
            Text: ="Give a person access. They sign in with the email below."
      - lblRNameL:
          Control: Label@2.5.1
          Properties:
            X: =If(Parent.Width < 1000, 16, Parent.Width - 474) + 16
            Y: =302 + If(Parent.Width < 1000, 48, 0)
            Width: =If(Parent.Width < 1000, Parent.Width - 32, 458) - 32
            Height: =22
            Visible: =varPanel = "role"
            Color: =RGBA(154, 164, 178, 1)
            Size: =12
            Text: ="Full name"
      - lblREmailL:
          Control: Label@2.5.1
          Properties:
            X: =If(Parent.Width < 1000, 16, Parent.Width - 474) + 16
            Y: =376 + If(Parent.Width < 1000, 48, 0)
            Width: =If(Parent.Width < 1000, Parent.Width - 32, 458) - 32
            Height: =22
            Visible: =varPanel = "role"
            Color: =RGBA(154, 164, 178, 1)
            Size: =12
            Text: ="Sign-in email (work email)"
      - lblRRoleL:
          Control: Label@2.5.1
          Properties:
            X: =If(Parent.Width < 1000, 16, Parent.Width - 474) + 16
            Y: =450 + If(Parent.Width < 1000, 48, 0)
            Width: =If(Parent.Width < 1000, Parent.Width - 32, 458) - 32
            Height: =22
            Visible: =varPanel = "role"
            Color: =RGBA(154, 164, 178, 1)
            Size: =12
            Text: ="Role"
      - lblRAreaL:
          Control: Label@2.5.1
          Properties:
            X: =If(Parent.Width < 1000, 16, Parent.Width - 474) + 16
            Y: =524 + If(Parent.Width < 1000, 48, 0)
            Width: =If(Parent.Width < 1000, Parent.Width - 32, 458) - 32
            Height: =22
            Visible: =varPanel = "role" && varIsDAAll
            Color: =RGBA(154, 164, 178, 1)
            Size: =12
            Text: ="Area (Data administrator can be All areas)"
      - txtRName:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =""
            X: =If(Parent.Width < 1000, 16, Parent.Width - 474) + 16
            Y: =326 + If(Parent.Width < 1000, 48, 0)
            Width: =If(Parent.Width < 1000, Parent.Width - 32, 458) - 32
            Height: =44
            Visible: =varPanel = "role"
            HintText: ="Person's name"
            Color: =RGBA(230, 233, 238, 1)
            Fill: =RGBA(29, 37, 46, 1)
            BorderColor: =RGBA(56, 66, 78, 1)
      - txtREmail:
          Control: Classic/TextInput@2.3.2
          Properties:
            Default: =""
            X: =If(Parent.Width < 1000, 16, Parent.Width - 474) + 16
            Y: =400 + If(Parent.Width < 1000, 48, 0)
            Width: =If(Parent.Width < 1000, Parent.Width - 32, 458) - 32
            Height: =44
            Visible: =varPanel = "role"
            HintText: ="Sign-in email"
            Color: =RGBA(230, 233, 238, 1)
            Fill: =RGBA(29, 37, 46, 1)
            BorderColor: =RGBA(56, 66, 78, 1)
      - ddRRole:
          Control: Classic/DropDown@2.3.1
          Properties:
            X: =If(Parent.Width < 1000, 16, Parent.Width - 474) + 16
            Y: =474 + If(Parent.Width < 1000, 48, 0)
            Width: =If(Parent.Width < 1000, Parent.Width - 32, 458) - 32
            Height: =44
            Visible: =varPanel = "role"
            Items: =colChRole
      - ddRArea:
          Control: Classic/DropDown@2.3.1
          Properties:
            X: =If(Parent.Width < 1000, 16, Parent.Width - 474) + 16
            Y: =548 + If(Parent.Width < 1000, 48, 0)
            Width: =If(Parent.Width < 1000, Parent.Width - 32, 458) - 32
            Height: =44
            Visible: =varPanel = "role" && varIsDAAll
            Items: |-
              =If(ddRRole.Selected.Value = "Data administrator", Ungroup(Table({t: Table({Name: "All areas"})}, {t: colAreaNames}), t), colAreaNames)
      - btnRoleSave:
          Control: Classic/Button@2.2.0
          Properties:
            X: =If(Parent.Width < 1000, 16, Parent.Width - 474) + 16
            Y: =606 + If(Parent.Width < 1000, 48, 0)
            Width: =(If(Parent.Width < 1000, Parent.Width - 32, 458) - 44) / 2
            Height: =44
            Text: ="Save assignment"
            Visible: =varPanel = "role"
            Fill: =RGBA(224, 164, 58, 1)
            Color: =RGBA(20, 17, 10, 1)
            BorderColor: =RGBA(224, 164, 58, 1)
            OnSelect: |-
              =With({vAll: varIsDAAll && ddRArea.Selected.Name = "All areas", vAreaRec: If(varIsDAAll, LookUp('Geographic Areas', Name = ddRArea.Selected.Name), varArea)},
                  If(IsBlank(txtRName.Text) || IsBlank(txtREmail.Text),
                      Set(varErr, "Enter the person's name and sign-in email."),
                      !vAll && IsBlank(vAreaRec),
                      Set(varErr, "Choose a geographic area."),
                      !vAll && ddRRole.Selected.Value in ["Area fire chief", "Assistant Chief Support Services", "Data administrator"] && !IsBlank(LookUp(FirstN('Role Assignments', 2000), Text('Assignment status') = "Active" && Text(Role) = ddRRole.Selected.Value && 'Geographic area'.Name = vAreaRec.Name)),
                      Set(varErr, "That role is already held in the area. End that assignment first."),
                      Patch('Role Assignments', Defaults('Role Assignments'), {Person: txtRName.Text, 'User email': Lower(txtREmail.Text), Role: Switch(ddRRole.Selected.Value, "Budget", 'Role (Role Assignments)'.Budget, "Area fire chief", 'Role (Role Assignments)'.'Area fire chief', "Deputy chief", 'Role (Role Assignments)'.'Deputy chief', "Assistant Chief Operations", 'Role (Role Assignments)'.'Assistant Chief Operations', "Assistant Chief Support Services", 'Role (Role Assignments)'.'Assistant Chief Support Services', "PMC member", 'Role (Role Assignments)'.'PMC member', "Data administrator", 'Role (Role Assignments)'.'Data administrator'), 'Assignment status': Switch("Active", "Active", 'Assignment status (Role Assignments)'.Active, "Ended", 'Assignment status (Role Assignments)'.Ended), 'All areas': vAll, 'Geographic area': If(vAll, Blank(), vAreaRec), 'Start date': Today()});
                      Patch('Hiring Events', Defaults('Hiring Events'), {Summary: "Assigned " & ddRRole.Selected.Value & " to " & txtRName.Text, 'Event type': Switch("Role assigned", "Stage change", 'Event type (Hiring Events)'.'Stage change', "Selection routed", 'Event type (Hiring Events)'.'Selection routed', "Approval", 'Event type (Hiring Events)'.Approval, "Detail", 'Event type (Hiring Events)'.Detail, "Incumbent change", 'Event type (Hiring Events)'.'Incumbent change', "Role assigned", 'Event type (Hiring Events)'.'Role assigned'), 'Geographic area': varArea, By: varMe, Note: ""});
                      Set(varNotice, txtRName.Text & " is now " & ddRRole.Selected.Value & ".");
                      Set(varPanel, "")))
      - btnRoleClose:
          Control: Classic/Button@2.2.0
          Properties:
            X: =If(Parent.Width < 1000, 16, Parent.Width - 474) + 16 + (If(Parent.Width < 1000, Parent.Width - 32, 458) - 44) / 2 + 12
            Y: =606 + If(Parent.Width < 1000, 48, 0)
            Width: =(If(Parent.Width < 1000, Parent.Width - 32, 458) - 44) / 2
            Height: =44
            Text: ="Cancel"
            Visible: =varPanel = "role"
            Fill: =RGBA(29, 37, 46, 1)
            Color: =RGBA(230, 233, 238, 1)
            BorderColor: =RGBA(56, 66, 78, 1)
            OnSelect: =Set(varPanel, ""); Set(varErr, "")
      - lblRoleErr:
          Control: Label@2.5.1
          Properties:
            X: =If(Parent.Width < 1000, 16, Parent.Width - 474) + 16
            Y: =658 + If(Parent.Width < 1000, 48, 0)
            Width: =If(Parent.Width < 1000, Parent.Width - 32, 458) - 32
            Height: =36
            Visible: =varPanel = "role"
            Color: =RGBA(244, 165, 138, 1)
            Size: =13
            Text: =varErr
