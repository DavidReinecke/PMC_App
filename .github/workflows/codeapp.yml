name: Check code app builds

on:
  push:
    paths: ['codeapp/**']
  pull_request:
    paths: ['codeapp/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codeapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: codeapp/package-lock.json
      - run: npm ci
      - run: npm run build
