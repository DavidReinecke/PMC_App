name: Build Workforce Planner solution

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Power Platform CLI
        shell: pwsh
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          pac help | Select-Object -First 5

      - name: Build and collect diagnostics
        shell: pwsh
        run: ./ci/build.ps1

      - name: Publish build output to the build-output branch
        if: always()
        shell: pwsh
        run: ./ci/publish.ps1
